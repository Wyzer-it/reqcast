[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reqcast"
version = "0.1.0"
description = "Converts a requirements spec (PDF, Markdown, plain text, or Word .docx) into ReqIF 1.2, preserving the document's own requirement identifiers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wyzer.it Ltd", email = "wyzer.os@wyzer.it" }]
keywords = [
    "reqif",
    "requirements",
    "requirements-engineering",
    "specification",
    "systems-engineering",
    "pdf",
    "docx",
    "markdown",
    "converter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: XML",
]

# Deliberately empty: extract.py, reqif.py, node_builder.py, and toon.py
# (the core - matching, tree-building, and ReqIF/TOON serialization) are
# pure stdlib. Each input format's real dependency is only imported when
# that format is actually used (layout.py's own `import pymupdf`,
# docx_extract.py's function-local `import docx`, --polish's function-local
# `import anthropic`) - see the extras below and README.md's Install section.
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf==1.28.2"]
docx = ["python-docx>=1.1"]
images = ["Pillow>=10"]
polish = ["anthropic>=0.69"]
all = ["reqcast[pdf,docx,images,polish]"]
dev = ["pytest>=8", "reportlab>=4", "python-docx>=1.1", "Pillow>=10"]

[project.urls]
Homepage = "https://github.com/Wyzer-it/reqcast"
Repository = "https://github.com/Wyzer-it/reqcast"
Issues = "https://github.com/Wyzer-it/reqcast/issues"
"Why TOON for --polish" = "https://wyzer.it/blog/Data-Format-Selection-for-Multi-Agent-LLM-Systems-An-Empirical-Analysis-of-Token-Efficiency"

[project.scripts]
reqcast = "reqcast.cli:main"

[tool.setuptools]
packages = ["reqcast"]
