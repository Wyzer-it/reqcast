name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python in pyproject.toml is the floor (3.12) - this repo
        # doesn't claim compatibility below that, unlike reqlint's single
        # dependency-free file.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install reqcast with all extras and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[all,dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Convert the bundled examples end to end
        run: |
          for f in pdf md txt docx; do
            python -m reqcast.cli examples/demo-spec.$f /tmp/demo-$f.reqifz --config examples/demo-config.json
          done

      - name: Verify the package builds and is well-formed
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
